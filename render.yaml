# Optional Render Blueprint: Dashboard → Blueprints → New Blueprint Instance, or link this repo.
# If you already created services manually, match `name` to your services or skip this file.
# Set secret env vars (MONGODB_URI, JWT_SECRET, etc.) in the dashboard or use sync: false prompts.

services:
  - type: web
    name: cleb-easy-backend-service
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: FRONTEND_URL
        value: https://cleb-easy.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false

  - type: web
    name: cleb-easy
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
